<!-- Merchant shell: Vault (shared styles in src/styles/_shell.scss) -->
<div class="tp-shell" [class.tp-shell--collapsed]="isSidebarCollapsed" [class.tp-shell--drawer-open]="showMobileSidebar">
  <a class="tp-skip-link" href="#main">Skip to content</a>

  <aside class="tp-side" aria-label="Merchant navigation">
    <div class="tp-side__brand">
      <img class="tp-side__logo" src="assets/brand/logo-on-navy@1x.png"
           srcset="assets/brand/logo-on-navy@1x.png 1x, assets/brand/logo-on-navy@2x.png 2x"
           width="40" height="30" alt="Tabital Pay">
      <span class="tp-side__name" *ngIf="!isSidebarCollapsed"><span aria-hidden="true">Tabital Pay</span> <small class="tp-side__role">Merchant</small></span>
      <button type="button" class="tp-side__close" (click)="closeMobileSidebar()" aria-label="Close menu">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <nav class="tp-side__nav">
      <ng-container *ngFor="let group of navGroups">
        <p class="tp-side__group" *ngIf="!isSidebarCollapsed">{{ group.label }}</p>
        <a *ngFor="let item of group.items" class="tp-side__item" [routerLink]="item.path" routerLinkActive="is-active"
           [attr.title]="isSidebarCollapsed ? item.label : null" (click)="closeMobileSidebar()">
          <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
          <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <div class="tp-side__foot">
      <div class="tp-side__user" *ngIf="!isSidebarCollapsed">
        <strong>{{ merchantName }}</strong>
        <span>{{ merchantVerified ? 'Verified merchant' : 'Verification pending' }}</span>
      </div>
      <button type="button" class="tp-side__item" (click)="logout()">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
        <span *ngIf="!isSidebarCollapsed">Log out</span>
      </button>
      <button type="button" class="tp-side__collapse" (click)="isSidebarCollapsed = !isSidebarCollapsed"
              [attr.aria-label]="isSidebarCollapsed ? 'Expand menu' : 'Collapse menu'">
        <lucide-icon [name]="isSidebarCollapsed ? 'chevron-right' : 'chevron-left'" [size]="16"></lucide-icon>
      </button>
    </div>
  </aside>
  <div class="tp-scrim" *ngIf="showMobileSidebar" (click)="closeMobileSidebar()" aria-hidden="true"></div>

  <div class="tp-main">
    <header class="tp-top">
      <button type="button" class="tp-top__menu" (click)="showMobileSidebar = true" aria-label="Open menu">
        <lucide-icon name="menu" [size]="22"></lucide-icon>
      </button>
      <div class="tp-top__title">
        <h1>{{ merchantName }}</h1>
        <p>{{ merchantVerified ? 'Verified merchant' : 'Complete your business verification to receive payouts' }}</p>
      </div>
      <div class="tp-top__actions">
        <a tpButton size="sm" routerLink="/merchant/payment-links">
          <lucide-icon name="qr-code" [size]="16"></lucide-icon> New sale
        </a>
      </div>
    </header>

    <main id="main" class="tp-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
