<!-- Admin shell: Vault (shared styles in src/styles/_shell.scss) -->
<div class="tp-shell" [class.tp-shell--collapsed]="isCollapsed" [class.tp-shell--drawer-open]="isMobileOpen">
  <a class="tp-skip-link" href="#main">Skip to content</a>

  <aside class="tp-side" aria-label="Admin navigation">
    <div class="tp-side__brand">
      <span class="logo-icon tp-mark-box" aria-hidden="true">T</span>
      <span class="tp-side__name" *ngIf="!isCollapsed">Tabital Pay <small class="tp-side__role">Admin</small></span>
      <button type="button" class="tp-side__close" (click)="closeSidebar()" aria-label="Close menu">
        <lucide-icon name="x" [size]="20"></lucide-icon>
      </button>
    </div>

    <nav class="tp-side__nav">
      <ng-container *ngFor="let group of navGroups">
        <p class="tp-side__group" *ngIf="!isCollapsed">{{ group.label }}</p>
        <a *ngFor="let item of group.items" class="tp-side__item" [routerLink]="item.path" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: !!item.exact }" [attr.title]="isCollapsed ? item.label : null"
           (click)="closeSidebar()">
          <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
          <span *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <div class="tp-side__foot">
      <button type="button" class="tp-side__item" (click)="logout()">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
        <span *ngIf="!isCollapsed">Log out</span>
      </button>
      <button type="button" class="tp-side__collapse" (click)="isCollapsed = !isCollapsed"
              [attr.aria-label]="isCollapsed ? 'Expand menu' : 'Collapse menu'">
        <lucide-icon [name]="isCollapsed ? 'chevron-right' : 'chevron-left'" [size]="16"></lucide-icon>
      </button>
    </div>
  </aside>
  <div class="tp-scrim" *ngIf="isMobileOpen" (click)="closeSidebar()" aria-hidden="true"></div>

  <div class="tp-main">
    <header class="tp-top">
      <button type="button" class="tp-top__menu" (click)="isMobileOpen = true" aria-label="Open menu">
        <lucide-icon name="menu" [size]="22"></lucide-icon>
      </button>
      <div class="tp-top__title">
        <h1>Operations</h1>
        <p>Approvals, risk and money movement</p>
      </div>
      <div class="tp-top__actions">
        <a tpButton="secondary" size="sm" routerLink="/admin/orders">
          <lucide-icon name="clipboard-list" [size]="16"></lucide-icon> Orders to approve
        </a>
      </div>
    </header>

    <main id="main" class="tp-content tp-content--wide" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
