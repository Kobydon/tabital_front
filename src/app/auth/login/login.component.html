<div class="login-container">
  <div class="login-card">
    <h2>✨ Welcome Back</h2>
    <div class="subtitle">Sign in to continue your journey</div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <!-- Phone Input with Icon -->
      <div class="input-group">
        <span class="input-icon">
          <i class="fas fa-user"></i>
        </span>
        <input 
          formControlName="phone" 
          placeholder="Phone Number / Email"
          type="text"
          autocomplete="username">
      </div>

      <!-- Password Input with Icon and Eye Toggle -->
      <div class="input-group password-group">
        <span class="input-icon">
          <i class="fas fa-lock"></i>
        </span>
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          formControlName="password" 
          placeholder="Password"
          autocomplete="current-password">
        <button 
          type="button" 
          class="eye-icon" 
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <i class="fas" [class.fa-eye]="showPassword" [class.fa-eye-slash]="!showPassword"></i>
        </button>
      </div>

        <div class="auth__row"><a routerLink="/forgot-password">Forgot password?</a></div>

        <div class="auth__error" role="alert" *ngIf="error">
          <lucide-icon name="triangle-alert" [size]="16"></lucide-icon> {{ error }}
        </div>

        <button tpButton type="submit" [block]="true" [disabled]="loading" [loading]="loading">
          <span *ngIf="loading" class="tp-spinner" aria-hidden="true"></span>
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="auth__alt">New to Tabital Pay? <a routerLink="/signup">Create an account</a></p>
    </div>
  </section>
</div>
